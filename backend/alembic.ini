[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# The URL is supplied at runtime from DATABASE_URL by alembic/env.py so no
# connection string is ever committed (CLAUDE.md: never commit secrets).
sqlalchemy.url =

[post_write_hooks]
# `exec` rather than `console_scripts`: ruff ships as a standalone binary and has no
# console_scripts entrypoint to resolve.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
