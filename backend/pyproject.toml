[project]
name = "whatsapp-marketing-backend"
version = "0.1.0"
description = "WhatsApp AI Marketing Platform - API and worker services"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "structlog>=24.4",
    "httpx>=0.27",
    "pgvector>=0.5.0",
    "argon2-cffi>=25.1.0",
    "openpyxl>=3.1.5",
    "phonenumbers>=9.0.37",
    "python-multipart>=0.0.32",
    "google-cloud-tasks>=2.24.0",
    "google-auth>=2.56.3",
    "sentence-transformers>=6.0.0",
    "pypdf>=6.16.1",
    # Declared directly, not left transitive, so [tool.uv.sources] can pin it to the
    # CPU wheel index — uv applies sources only to direct dependencies.
    "torch>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-openpyxl>=3.1.5.20260807",
]

[tool.uv]
package = false

# CPU-only PyTorch. The default wheels bundle CUDA runtimes worth roughly 10 GB, which
# the worker can never use — Cloud Run has no GPU — and which push the image past
# Cloud Run's 10 GiB limit.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

# ---------------------------------------------------------------- ruff

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "ASYNC",# async correctness
    "S",    # bandit security
    "T20",  # no print
    "RET",  # return simplification
    "SIM",  # simplify
    "TID",  # tidy imports
]
ignore = [
    "E501",  # line length handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
# S101: asserts are the point of tests.
# S105/S106: test files legitimately contain literal placeholder credentials; the
# rule is about production code, and per-line noqa on every fixture is noise.
# S311: seeded `random.Random` in tests is deterministic fixture material,
# never used for anything security-relevant.
"tests/**" = ["S101", "S105", "S106", "S311"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency system requires these in argument defaults; B008 otherwise
# flags the framework's own idiom.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
]

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# The Google client libraries ship no type information, so strict mode flags every
# call into them as untyped. Only the modules that touch that boundary are relaxed;
# their own signatures stay fully typed.
[[tool.mypy.overrides]]
module = [
    "app.integrations.queue.cloud_tasks",
    "app.worker.security",
    "tests.test_cloud_tasks_provider",
]
disallow_untyped_calls = false

# numpy's bundled stubs use `type` statements, which are 3.12 syntax; mypy pinned to
# 3.11 cannot parse them. sentence-transformers pulls numpy in transitively, so the
# stubs are skipped rather than lowering the project's target version. Nothing in this
# codebase calls numpy directly.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

# sentence-transformers and pypdf ship no usable type information for strict mode.
[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*", "pypdf", "pypdf.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
# Session scope so the session-scoped database engine fixture and the
# function-scoped connection fixtures that depend on it share one event loop.
# asyncpg connections are bound to the loop that created them, so mixing scopes
# produces a ScopeMismatch rather than a subtle runtime failure.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires external services (database, etc.)",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/persistence/migrations/*"]
