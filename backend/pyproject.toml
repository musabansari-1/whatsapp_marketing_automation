[project]
name = "whatsapp-marketing-backend"
version = "0.1.0"
description = "WhatsApp AI Marketing Platform - API and worker services"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "structlog>=24.4",
    "httpx>=0.27",
    "pgvector>=0.5.0",
    "argon2-cffi>=25.1.0",
    "openpyxl>=3.1.5",
    "phonenumbers>=9.0.37",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-openpyxl>=3.1.5.20260807",
]

[tool.uv]
package = false

# ---------------------------------------------------------------- ruff

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "ASYNC",# async correctness
    "S",    # bandit security
    "T20",  # no print
    "RET",  # return simplification
    "SIM",  # simplify
    "TID",  # tidy imports
]
ignore = [
    "E501",  # line length handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
# S101: asserts are the point of tests.
# S105/S106: test files legitimately contain literal placeholder credentials; the
# rule is about production code, and per-line noqa on every fixture is noise.
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency system requires these in argument defaults; B008 otherwise
# flags the framework's own idiom.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
]

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
# Session scope so the session-scoped database engine fixture and the
# function-scoped connection fixtures that depend on it share one event loop.
# asyncpg connections are bound to the loop that created them, so mixing scopes
# produces a ScopeMismatch rather than a subtle runtime failure.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires external services (database, etc.)",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/persistence/migrations/*"]
